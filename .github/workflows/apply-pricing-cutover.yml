name: Apply Pricing Cutover V1

on:
  push:
    branches:
      - chatgpt/20261017-pricing-cutover-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/20261017-pricing-cutover-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved pricing patch
        run: python tools/apply_pricing_cutover_v1.py
      - name: Commit patched website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "sales: align website with pricing v1"
          git push origin HEAD:chatgpt/20261017-pricing-cutover-v1
